    <style>
      /* Fallback black background during initial load to mask unstyled white background */
      html, body {
        background-color: #111 !important;
      }
      /* Prevent unstyled links from showing up as blue/red before CSS loads */

      }

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('click', function(e) {
          // Toggle mobile menu on burger click
          const burgerBtn = e.target.closest('.header-burger-btn');
          if (burgerBtn) {
            e.preventDefault();
            const isOpen = document.body.classList.contains('header--menu-open');
            if (isOpen) {
              document.body.classList.remove('header--menu-open');
              burgerBtn.setAttribute('aria-expanded', 'false');
            } else {
              document.body.classList.add('header--menu-open');
              burgerBtn.setAttribute('aria-expanded', 'true');
            }
          }
          
          // Close mobile menu if a link inside the menu is clicked
          if (e.target.closest('.header-menu-nav-item a')) {
            document.body.classList.remove('header--menu-open');
            document.querySelectorAll('.header-burger-btn').forEach(btn => {
              btn.setAttribute('aria-expanded', 'false');
            });
          }
        });
      });
    </script>

  </body>
