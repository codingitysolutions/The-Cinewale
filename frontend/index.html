<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Cinewale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  
    <!-- Preload critical Squarespace CSS to prevent FOUC -->
    <link rel="stylesheet" type="text/css" href="https://static1.squarespace.com/static/versioned-site-css/62838fda1d80b676079fcce4/83/5c5a519771c10ba3470d8101/62838fda1d80b676079fcd17/1816/site.css?nocustom=true"/>
    <link rel="stylesheet" type="text/css" href="https://static1.squarespace.com/static/vta/5c5a519771c10ba3470d8101/versioned-assets/1786731263525-36JJDFB14HC1BE313AOI/static.css"/>
    <link rel="stylesheet" type="text/css" href="https://static1.squarespace.com/static/custom-css/62838fda1d80b676079fcce4/62838fda1d80b676079fcd17/0/custom.css"/>
    
    <style>
      /* Fallback black background during initial load to mask unstyled white background */
      html, body {
        background-color: #111 !important;
      }
      /* Prevent unstyled links from showing up as blue/red before CSS loads */
      a {
        text-decoration: none;
        color: inherit;
      }
    </style>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('click', function(e) {
          // Toggle mobile menu on burger click
          const burgerBtn = e.target.closest('.header-burger-btn');
          if (burgerBtn) {
            e.preventDefault();
            const isOpen = document.body.classList.contains('header--menu-open');
            if (isOpen) {
              document.body.classList.remove('header--menu-open');
              burgerBtn.setAttribute('aria-expanded', 'false');
            } else {
              document.body.classList.add('header--menu-open');
              burgerBtn.setAttribute('aria-expanded', 'true');
            }
          }
          
          // Close mobile menu if a link inside the menu is clicked
          if (e.target.closest('.header-menu-nav-item a')) {
            document.body.classList.remove('header--menu-open');
            document.querySelectorAll('.header-burger-btn').forEach(btn => {
              btn.setAttribute('aria-expanded', 'false');
            });
          }
        });
      });
    </script>

  </body>
</html>
